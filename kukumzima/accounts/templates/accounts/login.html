<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        .errorlist {
            color: red;
        }
    </style>
</head>
<body>
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div>
            {{ form.username.label_tag }}
            {{ form.username }}
            {% for error in form.username.errors %}
                <div class="errorlist">{{ error }}</div>
            {% endfor %}
        </div>
        <div>
            {{ form.password.label_tag }}
            {{ form.password }}
            {% for error in form.password.errors %}
                <div class="errorlist">{{ error }}</div>
            {% endfor %}
        </div>
        <button type="submit">Login</button>
    </form>
</body>
</html>
